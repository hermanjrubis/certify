<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor — Certify | Bulk Certificate Generator</title>
  <meta name="description" content="Design and bulk generate beautiful certificates in your browser. 100% client-side.">
  <link rel="icon" type="image/png" href="/assets/logo.png">

  <!-- Google Fonts: UI Preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS Design System -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">

  <!-- JSZip CDN for in-browser archive packaging -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header" id="app-header">
    <div class="app-header-brand-group">
      <a href="index.html" class="brand-wrapper" title="Back to Certify Homepage">
        <img src="/assets/logo.png" alt="Certify Logo" class="brand-logo-img">
      </a>

      <div class="project-title-wrapper">
        <svg class="pencil-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
        </svg>
        <input 
          type="text" 
          id="project-title-input" 
          class="project-title-input" 
          value="Untitled batch" 
          aria-label="Certificate Project Title"
          title="Click to rename certificate project"
        >
      </div>

      <span class="mobile-step-indicator" id="mobile-step-indicator">Step 2 of 4 · Design</span>
    </div>

    <!-- Stepper Mount -->
    <div class="app-header-stepper-mount" id="stepper-mount"></div>

    <div class="app-header-actions">
      <span class="save-status-text" id="save-status-text">Saved in this browser</span>

      <!-- ⋯ Menu -->
      <div class="header-menu-container">
        <button type="button" class="btn btn-icon header-more-btn" id="btn-header-more" aria-label="More options" aria-haspopup="true" aria-expanded="false">
          ⋯
        </button>
        <div class="header-dropdown-menu" id="header-dropdown-menu" role="menu" style="display: none;">
          <button type="button" class="menu-item" role="menuitem" data-action="new-project">
            New project
          </button>
          <button type="button" class="menu-item" role="menuitem" data-action="export-project" disabled title="Upload a template first">
            Export project file
          </button>
        </div>
      </div>

      <!-- Primary Action -->
      <button type="button" class="btn btn-primary" id="btn-review-download" disabled title="Upload a template first">
        Review & download <span class="badge" id="btn-review-badge">0</span>
      </button>
    </div>
  </header>

  <!-- 4px Mobile Progress Bar -->
  <div class="mobile-progress-bar" id="mobile-progress-bar">
    <div class="mobile-progress-fill" id="mobile-progress-fill" style="width: 25%;"></div>
  </div>

  <!-- Main Work Area (No nested <main>) -->
  <main class="app-main">
    <div class="editor-frame">
      
      <!-- 1. Upload View State (Drop Zone) -->
      <section id="view-upload" class="upload-view-container">
        <div class="upload-dropzone" id="upload-dropzone" tabindex="0" role="button" aria-label="Drop certificate template image here">
          <div class="upload-icon-circle">
            <svg class="svg-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 16.5v1.5A2.5 2.5 0 0 0 6.5 20.5h11a2.5 2.5 0 0 0 2.5-2.5v-1.5" />
              <polyline points="7.5 8 12 3.5 16.5 8" />
              <line x1="12" y1="3.5" x2="12" y2="15" />
            </svg>
          </div>
          <h2 class="upload-title">Upload your certificate template</h2>
          <p class="upload-desc">Drag and drop your certificate design here, or click to browse files.</p>
          <span class="upload-meta-pill">PNG or JPG &bull; Up to 20MB</span>
          <input type="file" id="template-file-input" accept="image/png, image/jpeg, image/jpg, image/webp" style="display: none;">
        </div>
      </section>

      <!-- 2. Editing View State -->
      <section id="view-editing" style="display: none; flex: 1;">
        <div class="editor-workbench-grid" id="editor-workbench-grid">
          <!-- Left Column: Layers, Properties & Add Toolbar -->
          <aside id="left-panel-mount" class="editor-side-panel"></aside>

          <!-- Center Column: Canvas Stage & Text Field Placement (Div, not nested main) -->
          <div class="canvas-stage-wrapper">
            <div class="canvas-viewport-container" id="canvas-viewport-container">
              <canvas id="preview-canvas"></canvas>
            </div>
            <div id="row-switcher-mount"></div>

            <!-- Mobile Tabs (Layers / Style / Data) -->
            <div class="mobile-tabs-bar" role="tablist" id="mobile-tabs-bar">
              <button type="button" class="mobile-tab-btn active" data-tab="layers" role="tab" aria-selected="true">
                Layers
              </button>
              <button type="button" class="mobile-tab-btn" data-tab="style" role="tab" aria-selected="false">
                Style
              </button>
              <button type="button" class="mobile-tab-btn" data-tab="data" role="tab" aria-selected="false">
                Data · <span id="mobile-data-count">0</span>
              </button>
            </div>
          </div>

          <!-- Right Column: Recipients Table & Row Switcher -->
          <aside id="right-panel-mount" class="editor-side-panel"></aside>
        </div>

        <!-- Mobile Sticky Bottom Bar -->
        <div class="mobile-sticky-bottom-bar" id="mobile-sticky-bottom-bar">
          <button type="button" class="btn btn-primary btn-full-width" id="btn-mobile-review-download" disabled>
            Review & download · <span id="mobile-review-badge">0</span>
          </button>
        </div>
      </section>

      <!-- 3. Review & Export View State -->
      <section id="view-review" class="batch-preview-container" style="display: none;"></section>

    </div>
  </main>

  <!-- Application Coordinator Script -->
  <script type="module" src="/js/main.js"></script>
</body>
</html>

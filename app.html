<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor — Certify | Bulk Certificate Generator</title>
  <meta name="description" content="Design and bulk generate beautiful certificates in your browser. 100% client-side.">
  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- Google Fonts: UI & Certificate Fonts Preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Great+Vibes&family=Luxurious+Script&family=Marcellus&family=Mrs+Saint+Delafield&family=Parisienne&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@400;500;600;700&family=Sacramento&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">

  <!-- CSS Design System -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">

  <!-- JSZip CDN for in-browser archive packaging -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header" id="app-header">
    <div class="app-header-brand-group">
      <a href="index.html" class="brand-wrapper" title="Back to Certify Homepage">
        <img src="assets/logo.png" alt="Certify Logo" class="brand-logo-img">
      </a>

      <div class="project-title-wrapper">
        <input 
          type="text" 
          id="project-title-input" 
          class="project-title-input" 
          value="Graduation batch 2026" 
          aria-label="Certificate Project Name"
          title="Click to rename certificate project"
        >
        <span class="project-title-rename-hint-group" id="project-rename-hint-group" style="display: none;">
          <button type="button" class="project-title-rename-hint" id="project-rename-hint" title="Click to rename certificate project">
            Rename?
          </button>
          <button type="button" class="project-title-rename-dismiss" id="btn-dismiss-rename-hint" title="Dismiss rename hint" aria-label="Dismiss">&times;</button>
        </span>
      </div>
    </div>

    <div class="app-header-actions">
      <button type="button" class="btn btn-secondary btn-sm" id="btn-new-project" title="Start a fresh certificate design">
        <svg class="svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="12" y1="18" x2="12" y2="12" />
          <line x1="9" y1="15" x2="15" y2="15" />
        </svg>
        New project
      </button>

      <button type="button" class="btn btn-secondary btn-sm" id="btn-toggle-preview" title="Toggle Batch Preview Grid">
        <svg class="svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
        Preview
      </button>

      <button type="button" class="btn btn-secondary btn-sm" id="btn-save-project" title="Save draft to browser storage">
        <svg class="svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
          <polyline points="17 21 17 13 7 13 7 21" />
          <polyline points="7 3 7 8 15 8" />
        </svg>
        Save
      </button>

      <button type="button" class="btn btn-primary btn-sm" id="btn-generate-zip" title="Render all certificates and export as ZIP">
        <svg class="svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        Generate zip
      </button>
    </div>
  </header>

  <!-- Main Work Area -->
  <main class="app-main">
    <div class="editor-frame">
      
      <!-- 1. Upload View State (Drop Zone) -->
      <section id="view-upload" class="upload-view-container">
        <div class="upload-dropzone" id="upload-dropzone" tabindex="0" role="button" aria-label="Drop certificate template image here">
          <div class="upload-icon-circle">
            <svg class="svg-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 16.5v1.5A2.5 2.5 0 0 0 6.5 20.5h11a2.5 2.5 0 0 0 2.5-2.5v-1.5" />
              <polyline points="7.5 8 12 3.5 16.5 8" />
              <line x1="12" y1="3.5" x2="12" y2="15" />
            </svg>
          </div>
          <h2 class="upload-title">Upload your certificate template</h2>
          <p class="upload-desc">Drag and drop your certificate design here, or click to browse files.</p>
          <span class="upload-meta-pill">PNG or JPG &bull; Up to 20MB &bull; 100% Client-side</span>
          <input type="file" id="template-file-input" accept="image/png, image/jpeg, image/jpg, image/webp" style="display: none;">
        </div>
      </section>

      <!-- 2. Editing View State (Three Columns) -->
      <section id="view-editing" style="display: none; flex: 1;">
        <div class="editor-workbench-grid">
          
          <!-- Left Column: Typography & Style Panel -->
          <aside id="style-panel-mount"></aside>

          <!-- Center Column: Canvas Stage & Text Field Placement -->
          <main class="canvas-stage-wrapper">
            <div class="canvas-viewport-container" id="canvas-viewport-container">
              <canvas id="preview-canvas"></canvas>
            </div>
          </main>

          <!-- Right Column: Names List & Preview Trigger -->
          <aside id="names-panel-mount"></aside>

        </div>
      </section>

      <!-- 3. Batch Preview View State (Grid of Generated Certificates) -->
      <section id="view-preview" class="batch-preview-container" style="display: none;">
        <div class="preview-header-bar">
          <div class="preview-title-group">
            <h2 id="preview-batch-count">Batch Preview</h2>
            <p>Inspect every generated certificate before packaging into ZIP.</p>
          </div>

          <div class="preview-controls">
            <div class="search-input-wrapper">
              <svg class="svg-icon search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input type="text" id="preview-search-input" class="input preview-search-input" placeholder="Search recipient...">
            </div>

            <button type="button" class="btn btn-secondary btn-sm" id="btn-back-to-editor">
              <svg class="svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6" />
              </svg>
              Back to Editor
            </button>

            <button type="button" class="btn btn-primary btn-sm" id="btn-preview-export-zip">
              <svg class="svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              Export ZIP
            </button>
          </div>
        </div>

        <div class="certificates-grid" id="certificates-grid"></div>
      </section>

    </div>
  </main>

  <!-- Application Coordinator Script -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
